limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Known abusive source observed in logs.
  deny 107.175.89.136;

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location ^~ /_next/server-actions {
    return 404;
  }

  location ^~ /api/ {
    return 404;
  }

  location ~* \.php$ {
    return 404;
  }

  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    limit_req zone=req_per_ip burst=20 nodelay;
    limit_conn conn_per_ip 30;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ $uri.html /index.html;
  }
}
